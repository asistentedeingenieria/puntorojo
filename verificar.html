<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>PUNTO ROJO · Orden de compra</title>
<!-- v1225: página ESTÁTICA de verificación — el QR de cada orden de compra trae un enlace
     acá con los datos en el #fragmento (no llegan a ningún servidor, no hay login).
     Quien escanea ve el resumen legítimo de la orden con formato. Tono NEUTRO a propósito
     (decisión de Antonio): es un resumen digital, no una advertencia. -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; background: #F5F3EE; color: #1a1a1a; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 18px; }
  .card { background: #fff; border-radius: 14px; max-width: 430px; width: 100%; padding: 26px 24px; box-shadow: 0 6px 30px rgba(0,0,0,.08); }
  .marca { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .marca img { height: 34px; }
  .marca b { font-size: 13px; letter-spacing: 3px; }
  .tipo { font-size: 10px; letter-spacing: 2px; color: #888; margin-bottom: 16px; }
  .num { font-size: 22px; font-weight: 800; color: #C8141C; letter-spacing: 1px; margin-bottom: 14px; }
  .fila { display: flex; justify-content: space-between; gap: 14px; padding: 8px 0; border-top: 1px solid #F1EFE9; font-size: 13px; }
  .fila .k { color: #888; font-size: 11px; letter-spacing: 1px; padding-top: 1px; white-space: nowrap; }
  .fila .v { text-align: right; font-weight: 600; overflow-wrap: anywhere; }
  .total { background: #0F172A; color: #fff; border-radius: 8px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; margin: 12px 0; }
  .total span { font-size: 10px; letter-spacing: 2px; }
  .total b { font-size: 18px; }
  .sello { font-size: 10px; color: #888; letter-spacing: 1.5px; text-align: center; margin-top: 14px; }
  .pie { font-size: 10px; color: #B7B2A6; text-align: center; margin-top: 10px; letter-spacing: .5px; }
  .vacio { text-align: center; color: #888; font-size: 13px; padding: 30px 0; }
</style>
</head>
<body>
<div class="card">
  <div class="marca"><img src="logo.png" alt="" onerror="this.style.display='none'"><b>PUNTO ROJO</b></div>
  <div class="tipo">RESUMEN DIGITAL · ORDEN DE COMPRA</div>
  <div id="c"><div class="vacio">Sin datos — escaneá el QR de una orden.</div></div>
  <div class="pie">Emitido por la app PUNTO ROJO · puntorojo.app</div>
</div>
<script>
(function(){
  var _esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); };
  var ps;
  try { ps = new URLSearchParams(location.hash.slice(1)); } catch(e){ return; }
  var n = ps.get('n');
  if (!n) return;
  var fila = function(k, v){ return v ? '<div class="fila"><span class="k">' + k + '</span><span class="v">' + _esc(v) + '</span></div>' : ''; };
  var aut = ps.get('a') ? (ps.get('a') + (ps.get('u') ? ' (@' + ps.get('u') + ')' : '')) : '';
  document.getElementById('c').innerHTML =
    '<div class="num">' + _esc(n) + '</div>'
    + fila('PROVEEDOR', ps.get('p'))
    + fila('FECHA', ps.get('f'))
    + fila('AUTORIZADA POR', aut)
    + fila('FECHA DE AUTORIZACIÓN', ps.get('h'))
    + '<div class="total"><span>TOTAL</span><b>Q ' + _esc(ps.get('t') || '0.00') + '</b></div>'
    + (ps.get('s') ? '<div class="sello">SELLO · ' + _esc(ps.get('s')) + '</div>' : '');
})();
</script>
</body>
</html>
