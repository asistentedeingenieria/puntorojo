<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>PUNTO ROJO · Orden de compra</title>
<!-- v1225: página ESTÁTICA de verificación — el QR de cada orden trae un enlace acá con
     los datos en el #fragmento (no llegan a ningún servidor, no hay login). Tono NEUTRO
     a propósito (decisión de Antonio): es un resumen digital, no una advertencia.
     v1228: con la clave del admin, los datos viajan CIFRADOS (x/k/t) — la página pide la
     clave y solo con la correcta descifra (el tag t confirma). _selloHash32 y _qrKs deben
     ser IDÉNTICAS a las del index (regla v1168: las dos puntas iguales).
     v1228 diseño: FECHA DE SOLICITUD con hora, solo el NOMBRE de quien autoriza, total
     con comas de miles, pie en mayúscula. -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; background: #C8141C; color: #1a1a1a; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 18px; }
  .card { background: #fff; border-radius: 14px; max-width: 430px; width: 100%; padding: 26px 24px; box-shadow: 0 6px 30px rgba(0,0,0,.08); }
  .marca { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .marca img { height: 34px; }
  .marca b { font-size: 13px; letter-spacing: 3px; }
  .tipo { font-size: 10px; letter-spacing: 2px; color: #888; margin-bottom: 16px; }
  .num { font-size: 22px; font-weight: 800; color: #C8141C; letter-spacing: 1px; margin-bottom: 14px; }
  .fila { display: flex; justify-content: space-between; gap: 14px; padding: 8px 0; border-top: 1px solid #F1EFE9; font-size: 13px; }
  .fila .k { color: #888; font-size: 11px; letter-spacing: 1px; padding-top: 1px; white-space: nowrap; }
  .fila .v { text-align: right; font-weight: 600; overflow-wrap: anywhere; }
  .total { background: #0F172A; color: #fff; border-radius: 8px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; margin: 12px 0; }
  .total span { font-size: 10px; letter-spacing: 2px; }
  .total b { font-size: 18px; }
  .sello { font-size: 10px; color: #888; letter-spacing: 1.5px; text-align: center; margin-top: 14px; }
  .pie { font-size: 10px; color: #B7B2A6; text-align: center; margin-top: 10px; letter-spacing: 1px; }
  .vacio { text-align: center; color: #888; font-size: 13px; padding: 30px 0; }
  .clave-txt { font-size: 12.5px; color: #555; line-height: 1.6; margin-bottom: 12px; }
  .clave-inp { width: 100%; padding: 11px 12px; border: 1px solid #DDD8CC; border-radius: 8px; font: inherit; font-size: 14px; margin-bottom: 10px; }
  .clave-btn { width: 100%; padding: 11px; border-radius: 8px; background: #fff; color: #C8141C; border: 1.5px solid #C8141C; font: inherit; font-size: 13px; font-weight: 700; letter-spacing: 1px; cursor: pointer; transition: background .15s, color .15s; }
  .clave-btn:hover, .clave-btn:focus { background: #C8141C; color: #fff; outline: none; }
  .clave-err { font-size: 12px; color: #C8141C; margin-top: 8px; text-align: center; display: none; }
</style>
</head>
<body>
<div class="card">
  <div class="marca"><img src="logo.png" alt="" onerror="this.style.display='none'"><b>PUNTO ROJO<sup style="font-size:8px;letter-spacing:0;vertical-align:super">™</sup></b></div>
  <div class="tipo">RESUMEN DIGITAL · ORDEN DE COMPRA</div>
  <div id="c"><div class="vacio">Sin datos — escaneá el QR de una orden.</div></div>
  <div class="pie">EMITIDO POR LA APP PUNTOROJO.APP</div>
</div>
<script>
(function(){
  var _esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); };
  function _selloHash32(s, seed){
    var h = seed >>> 0;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    h ^= h >>> 13; h = Math.imul(h, 2246822507) >>> 0; h ^= h >>> 16;
    return h >>> 0;
  }
  function _qrKs(clave, salt, n){
    var s0 = (_selloHash32(clave + '|' + salt, 2166136261) || 1) >>> 0;
    var s1 = (_selloHash32(salt + '|' + clave, 40009) || 2) >>> 0;
    var s2 = (_selloHash32(clave + salt + clave, 8887) || 3) >>> 0;
    var s3 = (_selloHash32(salt + clave + salt, 123457) || 4) >>> 0;
    var out = [];
    for (var i = 0; i < n; i++) {
      var t = (s1 << 9) >>> 0;
      s2 = (s2 ^ s0) >>> 0; s3 = (s3 ^ s1) >>> 0; s1 = (s1 ^ s2) >>> 0; s0 = (s0 ^ s3) >>> 0;
      s2 = (s2 ^ t) >>> 0;
      s3 = ((s3 << 11) | (s3 >>> 21)) >>> 0;
      out.push(((s0 + s1) >>> 0) & 0xFF);
    }
    return out;
  }
  function _qrDescifrar(b64, clave, salt){
    var s = atob(String(b64 || '').replace(/-/g, '+').replace(/_/g, '/'));
    var ks = _qrKs(clave, salt, s.length), by = [];
    for (var i = 0; i < s.length; i++) by.push(s.charCodeAt(i) ^ ks[i]);
    var out = '', j = 0;
    while (j < by.length) {
      var b = by[j++];
      if (b < 128) out += String.fromCharCode(b);
      else if (b < 224) out += String.fromCharCode(((b & 31) << 6) | (by[j++] & 63));
      else out += String.fromCharCode(((b & 15) << 12) | ((by[j++] & 63) << 6) | (by[j++] & 63));
    }
    return out;
  }
  var _fmtTotal = function(t){ return (Number(t) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  var _render = function(ps){
    var n = ps.get('n');
    if (!n) return;
    /* v1236: la misma página sirve para PEDIDOS (d=p) — sin total ni autorización */
    var esPed = ps.get('d') === 'p';
    try { document.querySelector('.tipo').textContent = 'RESUMEN DIGITAL · ' + (esPed ? 'PEDIDO DE MATERIALES' : 'ORDEN DE COMPRA'); } catch(e){}
    var fila = function(k, v){ return v ? '<div class="fila"><span class="k">' + k + '</span><span class="v">' + _esc(v) + '</span></div>' : ''; };
    document.getElementById('c').innerHTML =
      '<div class="num">' + _esc(n) + '</div>'
      + fila('PROVEEDOR', ps.get('p'))
      + fila('PROYECTO', ps.get('pj'))
      + fila('NIVEL', ps.get('nv'))
      + fila('SOLICITANTE', ps.get('so'))
      + fila('FECHA DE SOLICITUD', ps.get('f'))
      + fila('ENTREGA DESEADA', ps.get('en'))
      + fila('AUTORIZADA POR', ps.get('a'))
      + fila('FECHA DE AUTORIZACIÓN', ps.get('h'))
      + (ps.get('t') ? '<div class="total"><span>TOTAL</span><b>Q ' + _esc(_fmtTotal(ps.get('t'))) + '</b></div>' : '')
      /* v1238 (Antonio): la firma salió de la hoja del pedido y vive ACÁ, en la confirmación
         del QR. v1240: si el QR trae v=<token>, la firma REGISTRADA real llega de la nube y
         reemplaza este trazo caligráfico (que queda de respaldo sin conexión). */
      + (esPed && ps.get('so') ? '<div id="firmaCal" style="margin-top:18px;text-align:center">'
          + '<div style="font-family:\'Brush Script MT\',\'Segoe Script\',\'Snell Roundhand\',cursive;font-size:27px;color:#1a1a1a;transform:rotate(-2deg)">' + _esc(ps.get('so')) + '</div>'
          + '<div style="border-top:1px solid #1a1a1a;max-width:230px;margin:7px auto 0;padding-top:6px;font-size:9.5px;letter-spacing:1.5px;color:#888">FIRMA DEL SOLICITANTE</div>'
        + '</div>' : '')
      + '<div id="vivo"></div>'
      + (ps.get('s') ? '<div class="sello">SELLO · ' + _esc(ps.get('s')) + '</div>' : '');
  };
  /* v1240: COPIA SELLADA EN LA NUBE. El QR trae v=<token>; el documento COMPLETO (renglones
     y firmas registradas reales) vive CIFRADO en ocVerif/<token> y se lee por REST — sin
     backend propio, directo de Firestore. La imagen compartida es cortesía: si no cuadra
     con esto, es falsa. Un fallo de red deja el resumen del QR tal como está. */
  var _firmaImg = function(src, nombre, cargo){
    if (!src || String(src).indexOf('data:image/') !== 0) return '';
    /* v1243: mix-blend-mode:multiply funde el blanco del JPEG con la tarjeta — la firma
       queda como TINTA sobre el documento, nunca con fondo */
    return '<div style="text-align:center;flex:1;min-width:150px">'
      + '<img class="fmg" src="' + src + '" style="height:52px;max-width:190px;object-fit:contain;display:block;margin:0 auto;mix-blend-mode:multiply" alt="">'
      + '<div style="border-top:1px solid #1a1a1a;max-width:200px;margin:5px auto 0;padding-top:5px;font-size:11px;font-weight:700">' + _esc(nombre || '') + '</div>'
      + '<div style="font-size:8.5px;letter-spacing:1.5px;color:#888;margin-top:2px">' + _esc(cargo || '') + '</div>'
      + '</div>';
  };
  /* v1244: la firma se LIMPIA al mostrarla — lo claro (el fondo de la foto, aunque no sea
     blanco puro) se vuelve transparente y queda solo el trazo, como tinta sobre el
     documento. Arregla también las copias selladas ANTES de v1243 (firma cruda). Si el
     procesado falla, el mix-blend-mode:multiply del estilo queda de respaldo. */
  var _firmaLimpiar = function(img){
    try {
      var c = document.createElement('canvas');
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      if (!c.width || !c.height) return;
      var cx = c.getContext('2d');
      cx.drawImage(img, 0, 0);
      var id = cx.getImageData(0, 0, c.width, c.height), data = id.data;
      for (var i = 0; i < data.length; i += 4) {
        var v = Math.max(data[i], data[i + 1], data[i + 2]);
        var a = v >= 235 ? 0 : (v <= 180 ? 255 : Math.round((235 - v) * 255 / 55));
        data[i + 3] = Math.min(data[i + 3], a);
      }
      cx.putImageData(id, 0, 0);
      img.src = c.toDataURL('image/png');
    } catch(e){}
  };
  var _renderNube = function(d){
    var el = document.getElementById('vivo');
    if (!el || !d) return;
    /* v1258: la orden fue ANULADA (autorización retirada o eliminada) — la hoja ya
       compartida lo delata en ROJO y no se pintan renglones ni firmas */
    if (d.anulada) {
      el.innerHTML = '<div style="margin-top:16px;background:#FEF2F2;border:1.5px solid #DC2626;border-radius:8px;padding:12px 14px;font-size:11px;letter-spacing:1px;color:#B91C1C;font-weight:700;text-align:center;line-height:1.7">ESTA ORDEN FUE ANULADA — NO PAGAR CONTRA ESTA HOJA'
        + (d.motivo ? '<div style="font-weight:600;letter-spacing:.3px;margin-top:4px">' + _esc(d.motivo) + (d.fecha ? ' · ' + _esc(d.fecha) : '') + '</div>' : '')
        + '</div>';
      try { var fc0 = document.getElementById('firmaCal'); if (fc0) fc0.style.display = 'none'; } catch(e){}
      return;
    }
    var esPed = d.d === 'p';
    var conDinero = !esPed && !d.sinDinero;
    var _q = function(v){ return (Number(v) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
    /* v1243: el mensaje verde nombra el documento (tipo viaja en el payload; los QRs de la
       primera hora no lo traen — se deduce) y SOLO dice que fue leído en vivo. */
    var tipo = String(d.tipo || (esPed ? 'PEDIDO DE MATERIALES' : (d.sinDinero ? 'ORDEN DE DESPACHO' : 'ORDEN DE COMPRA')));
    var leido = tipo.indexOf('ORDEN') === 0 ? 'LEÍDA' : 'LEÍDO';
    /* v1243: listados largos — los primeros renglones a la vista, el resto tras VER DETALLE */
    var _tr = function(cs, oculta){
      return '<tr' + (oculta ? ' class="xtra" style="display:none"' : '') + '>' + cs + '</tr>';
    };
    var todas = (d.items || []).map(function(it){
      return '<td style="padding:5px 8px;border-top:1px solid #F1EFE9;font-size:11.5px;overflow-wrap:anywhere">' + _esc(it.n) + '</td>'
        + '<td style="padding:5px 8px;border-top:1px solid #F1EFE9;text-align:center;font-size:11.5px;font-weight:700">' + _esc(it.q) + '</td>'
        + (conDinero ? '<td style="padding:5px 8px;border-top:1px solid #F1EFE9;text-align:right;font-size:11.5px;white-space:nowrap">Q ' + _q(it.pu) + '</td>'
          + '<td style="padding:5px 8px;border-top:1px solid #F1EFE9;text-align:right;font-size:11.5px;white-space:nowrap;font-weight:700">Q ' + _q((Number(it.q) || 0) * (Number(it.pu) || 0)) + '</td>' : '');
    }).concat((d.herramientas || []).map(function(h){
      return '<td style="padding:5px 8px;border-top:1px solid #F1EFE9;font-size:11.5px;color:#1D4ED8;overflow-wrap:anywhere">' + _esc(h.n) + '</td>'
        + '<td style="padding:5px 8px;border-top:1px solid #F1EFE9;text-align:center;font-size:11.5px;font-weight:700;color:#1D4ED8">' + _esc(h.q) + '</td>'
        + (conDinero ? '<td style="border-top:1px solid #F1EFE9"></td><td style="border-top:1px solid #F1EFE9"></td>' : '');
    }));
    var LIM = 8, corte = todas.length > LIM ? 6 : todas.length;
    var filas = todas.map(function(cs, i){ return _tr(cs, i >= corte); }).join('');
    var verMas = todas.length > corte
      ? '<tr id="verMasTr"><td colspan="4" style="padding:8px;border-top:1px solid #F1EFE9;text-align:center">'
        + '<button id="verMasBtn" style="padding:8px 16px;border-radius:8px;background:#fff;color:#C8141C;border:1.5px solid #C8141C;font:inherit;font-size:11px;font-weight:700;letter-spacing:1px;cursor:pointer">VER DETALLE · ' + (todas.length - corte) + ' RENGLONES MÁS</button>'
        + '</td></tr>'
      : '';
    var firmas = '';
    if (esPed) {
      firmas = _firmaImg(d.firmaSol, d.solicitante, 'FIRMA REGISTRADA DEL SOLICITANTE');
    } else {
      firmas = _firmaImg(d.firmaGen, d.generadoPor, 'GENERADO POR — REGISTRADA') + _firmaImg(d.firmaAut, d.autorizadoPor, 'AUTORIZADO POR — REGISTRADA');
    }
    el.innerHTML =
      /* v1244 (Antonio): el mensaje SIEMPRE en una fila única — nowrap y la letra se encoge
         hasta caber (nunca quiebra ni se corta) */
      '<div id="bannerVivo" style="margin-top:16px;background:#F0FDF4;border:1px solid #16A34A;border-radius:8px;padding:8px 12px;font-size:10px;letter-spacing:1.5px;color:#166534;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden">' + _esc(tipo) + ' · ' + leido + ' EN VIVO EN LA NUBE</div>'
      /* v1284: BLOQUE DE COTEJO — el número en GRANDE + proveedor/proyecto/entrega + quién
         autorizó y cuándo, con la instrucción explícita. El QR es imposible de falsificar
         (lee la copia sellada); esto cierra el último hueco: que el QR pegado sea de OTRO
         documento legítimo. Cotejar número + proveedor + total delata cualquier alteración. */
      + (d.numero ? '<div style="margin-top:12px;text-align:center">'
        + '<div style="font-size:22px;font-weight:800;letter-spacing:1px;color:#C8141C">' + _esc(d.numero) + '</div>'
        + ((d.proveedor || d.proyecto || d.entrega) ? '<div style="font-size:10.5px;color:#555;letter-spacing:.5px;margin-top:2px">' + _esc(d.proveedor || '') + (d.proyecto ? ' · ' + _esc(d.proyecto) : '') + (d.entrega ? ' · ENTREGA ' + _esc(d.entrega) : '') + '</div>' : '')
        + ((d.autorizadoFecha || d.autorizadoPor) ? '<div style="font-size:10px;color:#166534;font-weight:700;letter-spacing:.5px;margin-top:3px">AUTORIZADA · ' + _esc(d.autorizadoFecha || '') + (d.autorizadoPor ? ' · ' + _esc(d.autorizadoPor) : '') + '</div>' : '')
        + '<div style="font-size:9px;color:#B45309;font-weight:700;letter-spacing:.8px;margin-top:7px;line-height:1.6">COTEJÁ NÚMERO, PROVEEDOR, TOTAL, PAGO Y ENTREGA CONTRA EL PAPEL — LO QUE VALE ES LO QUE VES AQUÍ</div>'
        + '</div>' : '')
      + '<table style="width:100%;border-collapse:collapse;margin-top:10px"><thead><tr>'
      + '<th style="text-align:left;font-size:9px;letter-spacing:1.5px;color:#888;padding:4px 8px">DESCRIPCIÓN</th>'
      + '<th style="text-align:center;font-size:9px;letter-spacing:1.5px;color:#888;padding:4px 8px">CANT</th>'
      + (conDinero ? '<th style="text-align:right;font-size:9px;letter-spacing:1.5px;color:#888;padding:4px 8px">PRECIO U</th><th style="text-align:right;font-size:9px;letter-spacing:1.5px;color:#888;padding:4px 8px">TOTAL</th>' : '')
      + '</tr></thead><tbody>' + filas + verMas + '</tbody></table>'
      + (conDinero ? '<div class="total" style="margin-top:10px"><span>TOTAL</span><b>Q ' + _q(d.total) + '</b></div>' : '')
      + (conDinero && (Number(d.saldoAplicado) || 0) > 0 ? '<div class="fila"><span class="k">SALDO A FAVOR APLICADO</span><span class="v">− Q ' + _q(d.saldoAplicado) + '</span></div>' : '')
      /* v1286: cotejo COMPLETO — forma de pago, entregar a y renta son lo alterable sin
         tocar el total. Condicionales: las copias selladas antes de pv:3 no traen los
         campos y no pintan nada (se re-sellan solas al volver a imprimir/compartir). */
      + (d.formaPago ? '<div class="fila"><span class="k">FORMA DE PAGO</span><span class="v">' + _esc(d.formaPago) + ((Number(d.credito) || 0) > 0 ? ' · CRÉDITO ' + (Number(d.credito) || 0) + ' DÍAS' : '') + '</span></div>' : '')
      + (d.entregarA ? '<div class="fila"><span class="k">ENTREGAR A</span><span class="v" style="font-size:11.5px;font-weight:600">' + _esc(d.entregarA) + '</span></div>' : '')
      + ((Number(d.rentaDias) || 0) > 0 ? '<div class="fila"><span class="k">RENTA</span><span class="v">' + (Number(d.rentaDias) || 0) + ' DÍAS' + (d.rentaInicio ? ' · DEL ' + _esc(d.rentaInicio) : '') + (d.rentaFin ? ' AL ' + _esc(d.rentaFin) : '') + '</span></div>' : '')
      + (firmas ? '<div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:18px">' + firmas + '</div>' : '');
    if (firmas) { try { var fc = document.getElementById('firmaCal'); if (fc) fc.style.display = 'none'; } catch(e){} }
    try {
      var bn = document.getElementById('bannerVivo');
      if (bn) {
        var _fs = 10;
        while (bn.scrollWidth > bn.clientWidth && _fs > 6) {
          _fs -= 0.5;
          bn.style.fontSize = _fs + 'px';
          if (_fs < 8.5) bn.style.letterSpacing = '0.5px';
        }
      }
    } catch(e){}
    try {
      var fm = el.querySelectorAll('img.fmg');
      for (var fi = 0; fi < fm.length; fi++) (function(im){
        if (im.complete && im.naturalWidth) _firmaLimpiar(im);
        else im.onload = function(){ im.onload = null; _firmaLimpiar(im); };
      })(fm[fi]);
    } catch(e){}
    try {
      var b = document.getElementById('verMasBtn');
      if (b) b.onclick = function(){
        var xs = el.querySelectorAll('.xtra');
        for (var i = 0; i < xs.length; i++) xs[i].style.display = '';
        var t = document.getElementById('verMasTr'); if (t) t.remove();
      };
    } catch(e){}
  };
  var _nube = function(tok, clave){
    if (!tok || !clave) return;
    var url = 'https://firestore.googleapis.com/v1/projects/punto-rojo-3fcf1/databases/(default)/documents/ocVerif/' + encodeURIComponent(tok) + '?key=AIzaSyCbfWmw9kAFG73tv94H2Dg-uqHwu6vFaAE';
    fetch(url).then(function(r){ return r.ok ? r.json() : null; }).then(function(j){
      try {
        var f = j && j.fields;
        if (!f) return;
        var x = (f.x && f.x.stringValue) || '', k = (f.k && f.k.stringValue) || '', tg = (f.t && f.t.stringValue) || '';
        if (!x) return;
        var plano = _qrDescifrar(x, clave, k);
        /* mismo tag de 6 hex (seed 777) que el QR: sin la clave correcta no hay documento */
        if (('000000' + ((_selloHash32(plano, 777) >>> 0).toString(16))).slice(-6) !== tg) return;
        _renderNube(JSON.parse(plano));
      } catch(e){}
    }).catch(function(){});
  };
  var _intentar = function(ps0, clave){
    try {
      var plano = _qrDescifrar(ps0.get('x'), clave, ps0.get('k') || '');
      if (('000000' + ((_selloHash32(plano, 777) >>> 0).toString(16))).slice(-6) !== ps0.get('t')) return false;
      try { sessionStorage.setItem('prQrClave', clave); } catch(e){}
      var psP = new URLSearchParams(plano);
      _render(psP);
      try { _nube(psP.get('v'), clave); } catch(e){} /* v1240: el doc completo llega de la nube, fire-and-forget */
      return true;
    } catch(e){ return false; }
  };
  var _pedirClave = function(ps0){
    document.getElementById('c').innerHTML =
      '<div class="clave-txt" style="font-size:11.5px;letter-spacing:1px;font-weight:700;color:#1a1a1a">PARA PODER VER EL DOCUMENTO VERIFICADO INGRESA LA CLAVE.</div>'
      + '<input class="clave-inp" id="cl" type="password" placeholder="CLAVE" autocomplete="off">'
      + '<button class="clave-btn" id="clb">VER RESUMEN</button>'
      + '<div class="clave-err" id="cle">Clave incorrecta.</div>';
    var go = function(){
      var v = (document.getElementById('cl') || {}).value || '';
      if (!_intentar(ps0, v)) {
        var e = document.getElementById('cle');
